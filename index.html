<body>
  <div id="root" data-screen-label="Home"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="detail.jsx"></script>
  <script type="text/babel" src="tournaments.jsx"></script>
  <script type="text/babel" src="tournament-detail.jsx"></script>
  <script type="text/babel" src="blog.jsx"></script>
  <script type="text/babel" src="about-contact.jsx"></script>
  <script type="text/babel" src="legal.jsx"></script>
  <script type="text/babel" src="faq.jsx"></script>
  <script type="text/babel" src="safeguarding.jsx"></script>
  <script type="text/babel" src="application.jsx"></script>

  <script type="text/babel">
    const { useState: useStateApp2 } = React;
    function App() {
      const [route, setRoute] = useStateApp2("home");

      const urlMap = {
        "home": "/",
        "about": "/about",
        "contact": "/contact",
        "application": "/application",
        "tournaments": "/tournaments",
        "blog": "/journal",
        "blog-post": "/journal/post",
        "faq": "/faq",
        "terms": "/terms-conditions",
        "privacy": "/privacy-policy",
        "safeguarding": "/safeguarding",
        "exp-nxgenpro": "/nxgenpro-experience",
        "exp-levante": "/levanteexperience",
        "exp-betis": "/betisexperience",
        "exp-benfica": "/benficaexperience",
        "exp-feyenoord": "/feyenoordexperience",
        "tour-mic-costa-brava": "/mic-costa-brava",
        "tour-copa-daurada": "/copa-daurada",
        "tour-mare-nostrum": "/mare-nostrum",
        "tour-cruyff": "/cruyff-tournament",
        "tour-levante-cup": "/levante-international-cup",
        "tour-mic-punta-cana": "/mic-punta-cana",
        "tour-easter-youth-cup": "/easter-youth-cup",
        "tour-winter-cup-nl": "/winter-cup-holland",
      };

      const reverseUrlMap = Object.fromEntries(Object.entries(urlMap).map(([k, v]) => [v, k]));

      React.useEffect(() => {
        const path = window.location.pathname;
        const routeKey = reverseUrlMap[path] || "home";
        setRoute(routeKey);
      }, []);

      const navigate = (newRoute) => {
        const url = urlMap[newRoute] || "/";
        window.history.pushState({}, "", url);
        setRoute(newRoute);
      };

      React.useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [route]);
      const isExp = typeof route === "string" && route.startsWith("exp-");
      const isTour = typeof route === "string" && route.startsWith("tour-");
      React.useEffect(() => { window.__navigate = navigate; }, []);
      const postId = window.__postId || "p01";
      const label =
        route === "home" ? "Home" :
        route === "tournaments" ? "Tournaments" :
        route === "blog" ? "Journal" :
        route === "blog-post" ? "Journal · Post" :
        route === "about" ? "About" :
        route === "contact" ? "Contact" :
        route === "application" ? "Application" :
        route === "faq" ? "FAQ" :
        route === "terms" ? "Terms & Conditions" :
        route === "privacy" ? "Privacy Policy" :
        route === "safeguarding" ? "Safeguarding" :
        route === "detail" ? "Experiences" :
        isExp ? "Experience · " + route.replace("exp-", "") :
        isTour ? "Tournament · " + route.replace("tour-", "") : route;
      return (
        <div data-screen-label={label}>
          {route === "home" && <Home onNavigate={navigate} />}
          {(route === "detail" || isExp) && <Detail onNavigate={navigate} expId={isExp ? route : "exp-levante"} />}
          {isTour && <TournamentDetail onNavigate={navigate} tourId={route} />}
          {route === "tournaments" && <Tournaments onNavigate={navigate} />}
          {route === "blog" && <Blog onNavigate={navigate} />}
          {route === "blog-post" && <BlogPost onNavigate={navigate} postId={postId} />}
          {route === "about" && <About onNavigate={navigate} />}
          {route === "contact" && <Contact onNavigate={navigate} />}
          {route === "application" && <Application onNavigate={navigate} />}
          {route === "faq" && <FAQ onNavigate={navigate} />}
          {route === "terms" && <TermsAndConditions onNavigate={navigate} />}
          {route === "privacy" && <PrivacyPolicy onNavigate={navigate} />}
          {route === "safeguarding" && <Safeguarding onNavigate={navigate} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

[build]
  publish = "."

# Use Netlify prerender plugin for better SEO and indexability
[[plugins]]
  package = "@netlify/plugin-prerender"
  [plugins.inputs]
    routes = [
      "/",
      "/nxgenpro-experience",
      "/levanteexperience",
      "/betisexperience",
      "/benficaexperience",
      "/feyenoordexperience",
      "/tournaments",
      "/mic-costa-brava",
      "/copa-daurada",
      "/mare-nostrum",
      "/cruyff-tournament",
      "/levante-international-cup",
      "/mic-punta-cana",
      "/easter-youth-cup",
      "/winter-cup-holland",
      "/journal",
      "/faq",
      "/terms-conditions",
      "/privacy-policy",
      "/safeguarding",
      "/about",
      "/contact",
      "/application"
    ]
    staticQueryString = "prerender=true"

# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Cache headers for static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
